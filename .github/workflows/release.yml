name: Release Agent

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, windows, darwin]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21' # 替换为你的 Go 版本
          
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          OUTPUT_NAME=float-agent-${{ matrix.goos }}-${{ matrix.goarch }}
          if [ "${{ matrix.goos }}" = "windows" ]; then
            OUTPUT_NAME+='.exe'
          fi
          go build -ldflags="-s -w -X 'Float-agent/internal/collector.ProbeVersion=${{ github.ref_name }}'" -o $OUTPUT_NAME ./cmd/probe/main.go
          
      - name: Upload binaries to Release
        uses: softprops/action-gh-release@v1
        with:
          files: float-agent-*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}